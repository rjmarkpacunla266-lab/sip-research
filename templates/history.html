<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>History: Sturch</title>
<meta name="description" content="Your search history on Sturch."/>
<meta name="theme-color" content="#2f5bea"/>
<script>
(function(){try{var t=localStorage.getItem('sturch_theme');
 if(t!=='dark'&&t!=='light')t=(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';
 document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<style>
:root,[data-theme="light"]{
  --bg:#f5f8ff;--surf:#ffffff;--surf2:#f1f5fd;--surf3:#e4ebfb;
  --border:#dfe6f5;--accent:#2f5bea;--accent-h:#2449c4;--accent-soft:#e6edff;--accent2:#6b4de0;
  --gold:#a86a00;--green:#12805c;--green-bg:#dcf5ea;--red:#c93a3a;--orange:#b8560f;--orange-bg:#fdeede;
  --text:#14203d;--muted:#5d6b8c;--shadow:0 1px 2px rgba(25,45,100,.06),0 6px 18px rgba(25,45,100,.06);
  --mono:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--serif:var(--mono);--sans:var(--mono);--r:12px;
}
[data-theme="dark"]{
  --bg:#0a1020;--surf:#111a30;--surf2:#17223d;--surf3:#1f2c4d;
  --border:#25314f;--accent:#4d7bff;--accent-h:#6a90ff;--accent-soft:#1a2850;--accent2:#9d86ff;
  --gold:#f0c35a;--green:#4fd6a0;--green-bg:#123a2d;--red:#f27a7a;--orange:#f0914b;--orange-bg:#3a2713;
  --text:#e8eeff;--muted:#9aa8c9;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.28);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh}
a{color:var(--accent);text-decoration:none}
.hidden{display:none!important}

/* ═════════ Sturch redesign (matches home, search, answer) ═════════ */
body{font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
a:hover{text-decoration:none}
.btn{border-radius:10px;min-height:40px;padding:0 16px;font-weight:600;background:var(--surf)}
.btn:hover{border-color:var(--accent);color:var(--accent);background:var(--surf)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-h);color:#fff}
.btn.sm{min-height:40px;padding:0 14px}
.btn.xs{min-height:38px;padding:0 13px;font-size:.8rem}
header.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;height:60px;margin:0 -16px;padding:0 16px;background:color-mix(in srgb,var(--surf) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);flex-wrap:nowrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.3rem;letter-spacing:-.01em;color:var(--text)}
.sp{flex:1}
.icon-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:var(--surf);display:grid;place-items:center;font-size:1.02rem;cursor:pointer;color:var(--text)}
.icon-btn:hover{border-color:var(--accent)}
.me{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#3e92fc,#9357fc);color:#fff;font:700 1rem var(--sans);display:grid;place-items:center;border:0;cursor:pointer}
.menu{position:absolute;right:0;top:46px;min-width:210px;background:var(--surf);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow);padding:6px;display:none;z-index:40}
.menu.open{display:block}
.menu a{display:flex;gap:9px;align-items:center;padding:0 12px;min-height:44px;border-radius:9px;font-size:.92rem;color:var(--text)}
.menu a:hover{background:var(--surf2)}
.menu hr{border:0;border-top:1px solid var(--border);margin:4px 0}
.menu-who{padding:8px 12px;font-size:.78rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:230px}
.pagehead{display:flex;align-items:center;gap:10px;margin:16px 0 0}
.pagehead h1{font-size:1.4rem;font-weight:800;letter-spacing:-.01em}
.back{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--text);font-size:1.2rem}
.back:hover{background:var(--surf2)}
.subtitle{color:var(--muted);font-size:.92rem;margin:2px 0 14px 2px}
#app{max-width:860px;margin:0 auto;padding:0 16px 40px}

/* filters */
.fx-bar{margin:0 0 14px}
.fx-btn{min-height:44px;border-radius:12px;background:var(--surf);padding:0 14px;font-weight:600;font-size:.88rem;width:100%;justify-content:space-between;color:var(--text)}
.fx-sum{font-weight:500;font-family:var(--sans)}
.fx-panel{border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.fx-g label{font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:none}
.fx-g input,.fx-g select{min-height:42px;border-radius:10px;font-family:var(--sans);font-size:.9rem;background:var(--surf);color:var(--text)}
.fx-g input{width:90px}
.fx-toggle{min-height:42px;border-radius:10px;font-weight:600;background:var(--surf)}
.fx-toggle.on{color:var(--green);border-color:var(--green);background:var(--green-bg)}
.fx-chip{min-height:40px;display:inline-flex;align-items:center;padding:0 14px;font-size:.84rem;background:var(--surf)}
.fx-chip.active{background:var(--accent-soft)}
.fx-btn.sm{width:auto;min-height:40px;justify-content:flex-start}
.fx-note{font-size:.88rem;color:var(--muted);margin:10px 2px}
.fx-note b{color:var(--text)}
.tagrow{gap:6px}
.oa-b{font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--green-bg);border:0;color:var(--green)}
.pw-b{font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.src-b{font-size:.72rem;font-weight:600;padding:2px 9px}
.fx-empty,.no-result{padding:34px 16px}
.spinner{margin:40px auto}
#toast{background:var(--surf);color:var(--text);box-shadow:var(--shadow)}
.foot{margin:30px -16px 0;border-top:1px solid var(--border);padding:12px 16px 30px;font-size:.82rem;color:var(--muted);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 18px}
.foot nav{display:flex;flex-wrap:wrap}
.foot nav a{color:var(--muted);min-height:44px;display:inline-flex;align-items:center;padding:0 10px 0 0;margin-right:8px}
.foot nav a:hover{color:var(--accent)}
.empty-state{text-align:center;padding:26px 16px 10px}
.es-ic{color:var(--accent);margin-bottom:8px}
.empty-state h2{font-size:1.25rem;font-weight:800;margin-bottom:6px}
.empty-state p{color:var(--muted);font-size:.92rem;max-width:460px;margin:0 auto}
.es-ex{max-width:520px;margin:22px auto 0;text-align:left}
.es-lbl{font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.es-q{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:52px;padding:0 16px;margin-bottom:8px;background:var(--surf);border:1px solid var(--border);border-radius:12px;font:500 .95rem var(--sans);color:var(--text);cursor:pointer;text-align:left}
.es-q:hover{border-color:var(--accent);color:var(--accent)}
.es-q i{font-style:normal;color:var(--muted);font-size:1.3rem}
@media(max-width:480px){header.top{gap:6px}.brand{font-size:1.15rem;gap:6px}.icon-btn{width:38px;height:38px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}


.foot{margin:30px auto 0;max-width:860px;padding:12px 16px 30px}
.subtitle{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surf2);border:1px solid var(--border);border-radius:999px;padding:4px;margin:12px 0 14px}
.tab{display:flex;align-items:center;justify-content:center;min-height:42px;border-radius:999px;font-weight:700;font-size:.9rem;color:var(--muted)}
.tab.on{background:var(--accent);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.sfield{position:relative;flex:1 1 100%}
.sfield svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sfield input{width:100%;min-height:46px;border:1.5px solid var(--border);background:var(--surf);border-radius:999px;padding:0 16px 0 42px;font:inherit;font-size:.95rem;color:var(--text);outline:0}
.sfield input:focus{border-color:var(--accent)}
select.pill,.btn.pill{min-height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surf);color:var(--text);font:600 .86rem var(--sans);padding:0 12px;cursor:pointer}
.sp2{flex:1}
.count{font-weight:800;font-size:1rem;margin:12px 2px 10px}
.pcard{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.pc-top{display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
.pc-title{font-weight:700;font-size:1.02rem;line-height:1.35;color:var(--accent);overflow-wrap:anywhere;cursor:pointer;text-align:left;background:none;border:0;font-family:inherit;padding:0}
.pc-title:hover{text-decoration:underline}
.pc-when{font-size:.76rem;color:var(--muted);white-space:nowrap;flex:none}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.oa-b{font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--green-bg);color:var(--green)}
.pw-b{font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--border);color:var(--muted)}
.src-b{font-size:.72rem;font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surf);border:1px solid var(--border);color:var(--accent)}
.pc-meta{margin-top:6px;font-size:.84rem;color:var(--muted)}
.pc-snip{margin-top:8px;font-size:.9rem;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.act{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--surf);color:var(--text);font:600 .84rem var(--sans);cursor:pointer}
.act:hover{border-color:var(--accent);color:var(--accent)}
.act.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.act.danger{color:var(--red);border-color:var(--red)}
.act.danger.confirm{background:var(--red);color:#fff}
.empty-state{padding:34px 16px}
.empty-state .btn{margin-top:16px}
.layout{display:block}
.side{display:none}
@media(min-width:900px){
  .layout.two{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:20px;align-items:start}
  .side{display:block;position:sticky;top:76px}
  .sfield{flex:1 1 220px}
}
.panel{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.panel h3{font-size:1rem;font-weight:800;margin-bottom:10px}
.stat{display:flex;align-items:center;gap:12px;padding:8px 0}
.stat i{font-style:normal;width:40px;height:40px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.1rem}
.stat b{display:block;font-size:1.2rem}
.stat span{font-size:.8rem;color:var(--muted)}
/* collections */
.cgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:760px){.cgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ccard{position:relative;background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:14px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:12px;align-items:flex-start;text-align:left;font:inherit;color:inherit;width:100%}
.ccard:hover{border-color:var(--accent)}
.fic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:1.3rem}
.cname{font-weight:700;font-size:.95rem;overflow-wrap:anywhere}
.cmeta{font-size:.8rem;color:var(--muted)}
.dots{position:absolute;top:6px;right:6px;width:40px;height:40px;border-radius:50%;border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer}
.dots:hover{background:var(--surf2)}
.cmenu{position:absolute;top:44px;right:6px;z-index:5;min-width:150px;background:var(--surf);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:5px}
.cmenu button{display:block;width:100%;text-align:left;min-height:42px;padding:0 12px;border:0;background:none;border-radius:8px;font:600 .88rem var(--sans);color:var(--text);cursor:pointer}
.cmenu button:hover{background:var(--surf2)}
.cmenu .del{color:var(--red)}
.chead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.chead h2{font-size:1.2rem;font-weight:800;overflow-wrap:anywhere}
.chead .sp{flex:1}
.iconb{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:var(--surf);cursor:pointer;font-size:1rem;color:var(--text)}
.iconb:hover{border-color:var(--accent)}
.iconb.danger{color:var(--red)}
/* history */
.dayh{font-size:1rem;font-weight:800;margin:16px 2px 8px;display:flex;align-items:center;justify-content:space-between}
.clearall{font-size:.82rem;font-weight:600;color:var(--red);background:none;border:0;cursor:pointer;min-height:40px}
.hrow{background:var(--surf);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tg{padding:4px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:.85rem}
.fl{padding:3px 10px;border-radius:999px;background:var(--surf2);border:1px solid var(--border);color:var(--muted);font-size:.76rem}
.hmeta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.hfoot{display:flex;align-items:center;gap:8px;margin-top:10px}
.hfoot .when{flex:1;font-size:.82rem;color:var(--muted)}
/* bottom sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:90}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:100;background:var(--surf);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.25);max-width:560px;margin:0 auto}
@media(min-width:700px){.sheet{bottom:auto;top:50%;transform:translateY(-50%);border-radius:20px}}
.sheet h3{font-size:1.05rem;font-weight:800;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.sx{background:none;border:0;font-size:1.2rem;color:var(--muted);cursor:pointer;width:40px;height:40px}
.crow{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 4px;border-bottom:1px solid var(--border);cursor:pointer}
.crow input{width:22px;height:22px;accent-color:var(--accent)}
.crow span{flex:1;font-weight:600}
.crow small{color:var(--muted)}
.sbtns{display:flex;gap:10px;margin-top:14px}
.sbtns .btn:not(.primary){background:var(--surf);color:var(--text);border:1px solid var(--border)}
.sbtns .btn{flex:1;min-height:46px;justify-content:center}
.sheet input.txt{width:100%;min-height:46px;border:1.5px solid var(--border);border-radius:12px;padding:0 14px;font:inherit;background:var(--surf);color:var(--text);outline:0;margin-top:6px}
.sheet input.txt:focus{border-color:var(--accent)}

</style>
<style>
/* Phone fixes shared by all Sturch pages (loaded after each page's own styles). */
@media(max-width:600px){
  /* header: one row, never wraps (it used to push the avatar onto the page below) */
  header.top{flex-wrap:nowrap!important;gap:6px!important;padding-left:12px!important;padding-right:12px!important;overflow:visible}
  header.top .brand{font-size:1.12rem;gap:6px;min-width:0;flex:none}
  header.top .brand svg{width:26px;height:24px}
  header.top .seg{flex:none}
  header.top .seg button{padding:0 9px!important;font-size:.76rem!important;min-height:30px!important}
  header.top .icon-btn{width:38px;height:38px;flex:none}
  header.top .me{flex:none}
  header.top .avatar{width:36px;height:36px;flex:none}
  header.top .gchip{flex:none;min-height:32px;padding:0 9px;font-size:.72rem}
  /* account menu: always opens inside the screen, right-aligned */
  .menu{right:0!important;left:auto!important;width:min(250px,calc(100vw - 24px));min-width:0!important}
  .menu a{white-space:nowrap}
  /* search results: "169,992 results · showing 10 · from 5 sources" in one wrapping line */
  .stats-bar{flex-direction:row!important;flex-wrap:wrap!important;justify-content:flex-start!important;text-align:left!important;gap:2px 8px!important;display:flex!important;grid-template-columns:none!important}
  .stats-bar>*{display:inline!important}
  .stats-bar .dot{display:inline!important}
  .stats-bar .stat{padding:0!important;background:none!important;border:0!important}
  /* open card: the "auto-generated" label sits above the reference, not beside it */
  .card-foot{display:block!important}
  .card-foot .ref-warn{display:inline-block;margin-bottom:6px;white-space:normal}
  .card-foot .apa-text{display:block!important;width:100%!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;word-break:break-word;overflow-wrap:anywhere;font-size:.8rem}
  /* answer finder: source paper uses the full width, buttons wrap underneath */
  .source-card{flex-wrap:wrap!important}
  .source-info{flex:1 1 100%!important;min-width:0}
  .source-btns{flex:1 1 100%;flex-wrap:wrap}
  /* paper reader */
  .pagehead .pact.print{display:none}
  .pagehead{flex-wrap:nowrap;gap:6px}
  .pagehead h1{font-size:1.25rem}
  .pactions{flex-wrap:nowrap;gap:6px}
  .find-bar{gap:5px!important;padding:8px 12px!important}
  .find-wrap{flex:1 1 auto;min-width:0}
  .find-wrap input{font-size:.9rem;padding-right:8px}
  .find-nav{display:flex;align-items:center;gap:4px;flex:none}
  .nav-btn{width:34px!important;height:38px!important}
  .find-count{min-width:36px!important;font-size:.7rem!important;text-align:center}
  .find-bar .btn.sm{font-size:0!important;width:38px;min-width:38px;padding:0!important}
  .find-bar .btn.sm::before{content:'\2715';font-size:.9rem}
  .empty-state{padding:14px 8px 6px}
  .empty-state h2{font-size:1.1rem}
  .empty-state p{font-size:.86rem}
  .empty-state .es-ic svg{width:44px;height:44px}
}

<script>
function toggleTheme() {
  const html = document.documentElement, isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark'); paintTheme();
  try { localStorage.setItem('sturch_theme', isDark ? 'light' : 'dark'); } catch (e) {}
}
function paintTheme() { const b = document.getElementById('themeBtn'); if (b) b.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙'; }
function toggleMeMenu(e) {
  if (e) e.stopPropagation();
  const m = document.getElementById('meMenu'), btn = document.getElementById('meBtn');
  const o = m.classList.toggle('open'); btn.setAttribute('aria-expanded', String(o));
}
document.addEventListener('click', () => { const m = document.getElementById('meMenu'); if (m) { m.classList.remove('open'); document.getElementById('meBtn').setAttribute('aria-expanded', 'false'); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { const m = document.getElementById('meMenu'); if (m) m.classList.remove('open'); } });
paintTheme();
try { document.getElementById('yr').textContent = new Date().getFullYear(); } catch (e) {}
fetch('/api/me').then(r => r.ok ? r.json() : null).then(u => { if (u && u.email) { document.getElementById('userEmail').textContent = u.email; document.getElementById('meBtn').textContent = u.email.trim().charAt(0).toUpperCase(); } }).catch(() => {});


function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastTimer;
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2600);}
function ago(iso){
  if(!iso)return '';let t=Date.parse(iso);if(isNaN(t)){t=Date.parse(iso+'Z');if(isNaN(t))return ''}
  const s=Math.max(0,(Date.now()-t)/1000);if(s<60)return 'just now';const m=s/60;if(m<60)return Math.floor(m)+' min ago';
  const h=m/60;if(h<24)return Math.floor(h)+' hr'+(Math.floor(h)>1?'s':'')+' ago';const d=h/24;if(d<30)return Math.floor(d)+' day'+(Math.floor(d)>1?'s':'')+' ago';
  const mo=d/30;if(mo<12)return Math.floor(mo)+' mo ago';return Math.floor(d/365)+' yr ago';
}
function openSheet(html){const s=document.getElementById('sheet');s.innerHTML=html;s.classList.remove('hidden');document.getElementById('sheetBg').classList.remove('hidden');}
function closeSheet(){document.getElementById('sheet').classList.add('hidden');document.getElementById('sheetBg').classList.add('hidden');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
function srcBadge(ds){const s=String(ds||'').toLowerCase();
  const n=s.includes('arxiv')?'arXiv':s.includes('pubmed')?'PubMed':s.includes('crossref')?'Crossref':s.includes('europe')?'Europe PMC':s.includes('semantic')?'Semantic Scholar':'OpenAlex';
  return '<span class="src-b">'+n+'</span>';}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:'';}
function authorsLine(p){const a=(p.authors||[]);return a.slice(0,3).join(', ')+(a.length>3?' et al.':'');}
// The reader page reads the paper from sessionStorage (same as the search page does)
function paperLink(p){
  p = p || {};
  var d = String(p.doi || '').trim();
  if (d) return /^https?:/i.test(d) ? d : 'https://doi.org/' + d.replace(/^doi:\s*/i, '');
  if (p.oa_url) return p.oa_url;
  var id = String(p.openalex_id || '');
  if (/^https?:/i.test(id)) return id;
  if (id.indexOf('pmid:') === 0) return 'https://pubmed.ncbi.nlm.nih.gov/' + id.slice(5) + '/';
  return 'https://scholar.google.com/scholar?q=' + encodeURIComponent(p.title || '');
}
function readPaper(p){ window.open(paperLink(p), '_blank', 'noopener,noreferrer'); }
function copyText(t,msg){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(msg||'Copied')).catch(()=>toast('Could not copy'));}
async function api(url,opt){const r=await fetch(url,opt);let d={};try{d=await r.json();}catch(e){}if(r.status===401){location.href='/login';}return {ok:r.ok,status:r.status,d};}


const $=id=>document.getElementById(id);
let rows=[];
function dayKey(iso){let t=Date.parse(iso);if(isNaN(t))t=Date.parse(iso+'Z');const d=new Date(isNaN(t)?Date.now():t),n=new Date();
  const a=new Date(d.getFullYear(),d.getMonth(),d.getDate()),b=new Date(n.getFullYear(),n.getMonth(),n.getDate());const diff=Math.round((b-a)/86400000);
  return diff<=0?'Today':diff===1?'Yesterday':diff<7?'This week':diff<31?'Earlier this month':'Older';}
function timeOf(iso){let t=Date.parse(iso);if(isNaN(t))t=Date.parse(iso+'Z');if(isNaN(t))return '';return new Date(t).toLocaleString([], {hour:'numeric',minute:'2-digit',month:'short',day:'numeric'});}
function tagsOf(r){const f=r.filters||{};const t=(f.tags&&f.tags.length)?f.tags:[r.query];return t.filter(Boolean);}
function chipsOf(r){const f=r.filters||{},c=[];
  if(f.year_from||f.year_to)c.push((f.year_from||'…')+'–'+(f.year_to||'now'));
  if(f.oa)c.push('Open access');
  if(f.sources&&f.sources.length)c.push(f.sources.length+' source'+(f.sources.length>1?'s':'')); else c.push('All sources');
  if(f.sort==='recent')c.push('Most recent');
  if(f.field&&f.field!=='both')c.push(f.field==='title'?'Title only':'Abstract only');
  return c;}
function againUrl(r){const f=r.filters||{},p=new URLSearchParams();tagsOf(r).forEach(t=>p.append('tag',t));
  if(f.year_from)p.set('yf',f.year_from);if(f.year_to)p.set('yt',f.year_to);if(f.oa)p.set('oa','1');if(f.sort)p.set('sort',f.sort);
  if(f.field&&f.field!=='both')p.set('field',f.field);if(f.sources&&f.sources.length)p.set('src',f.sources.join(','));return '/search?'+p.toString();}
function render(){
  if(!rows.length){$('view').innerHTML='<div class="empty-state"><div class="es-ic" aria-hidden="true">🕐</div><h2>No searches yet</h2><p>Your searches will show up here so you can run them again.</p><a class="btn primary" href="/search">🔎 Search papers</a></div>';return;}
  const groups={},order=[];rows.forEach((r,i)=>{const k=dayKey(r.searched_at);if(!groups[k]){groups[k]=[];order.push(k);}groups[k].push(i);});
  $('view').innerHTML=order.map((k,gi)=>`<div class="dayh"><span>${k}</span>${gi===0?'<button class="clearall" id="clr" onclick="clearAll()">🗑 Clear all history</button>':''}</div>`+groups[k].map(i=>{const r=rows[i];
    return `<div class="hrow"><div class="tags">${tagsOf(r).map(t=>'<span class="tg">'+esc(t)+'</span>').join('')}</div>
      <div class="hmeta">${chipsOf(r).map(c=>'<span class="fl">'+esc(c)+'</span>').join('')}</div>
      <div class="hfoot"><span class="when">${r.results!=null?Number(r.results).toLocaleString()+' results · ':''}${esc(timeOf(r.searched_at))}</span>
        <a class="act primary" href="${esc(againUrl(r))}">Search again</a><button class="iconb danger" onclick="delOne(${i})" aria-label="Delete this search">🗑</button></div></div>`;}).join('')).join('');
}
async function delOne(i){const r=rows[i];const x=await api('/api/history/delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids:[r.id]})});
  if(x.ok){rows.splice(i,1);render();toast('Deleted');}else toast('Could not delete');}
let clrT;
async function clearAll(){const b=$('clr');
  if(!b.classList.contains('confirm')){b.classList.add('confirm');b.textContent='Tap again to clear everything';clearTimeout(clrT);clrT=setTimeout(()=>{if($('clr')){$('clr').classList.remove('confirm');$('clr').textContent='🗑 Clear all history';}},3500);return;}
  const x=await api('/api/history',{method:'DELETE'});if(x.ok){rows=[];render();toast('History cleared');}else toast('Could not clear');}
(async()=>{const r=await api('/api/history');
  if(!r.ok){$('view').innerHTML='<div class="empty-state"><h2>Could not load your history</h2><p>Check your connection and try again.</p><button class="btn primary" onclick="location.reload()">Try again</button></div>';return;}
  rows=r.d||[];render();})();

</script>
<script>
/* Guest notice: a slim banner under the header, and a small "Guest" chip once it is closed.
   Only shows for guest accounts (from /api/me). Safe to load on any page. */
(function(){
  var KEY='sturch_guest_note';
  function get(){try{return localStorage.getItem(KEY)}catch(e){return null}}
  function set(v){try{v?localStorage.setItem(KEY,v):localStorage.removeItem(KEY)}catch(e){}}
  fetch('/api/me').then(function(r){return r.ok?r.json():null}).then(function(u){
    if(!u||!u.is_guest)return;
    var days=u.guest_days||30,hd=document.querySelector('header.top')||document.querySelector('header');
    if(!hd)return;
    var st=document.createElement('style');
    st.textContent='.gn{display:flex;align-items:center;gap:10px;margin:10px 0 0;padding:10px 12px;border-radius:14px;border:1px solid var(--orange,#e0852f);background:var(--orange-bg,rgba(240,145,75,.16));color:var(--text);font-size:.86rem;line-height:1.4}'
      +'.gn span.t{flex:1;min-width:0}.gn a.gb{flex:none;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:999px;background:var(--accent,#2f5bea);color:#fff!important;font-weight:700;font-size:.82rem;text-decoration:none}'
      +'.gn button{flex:none;width:40px;height:40px;border:0;background:none;color:var(--muted,#7a86a8);font-size:1.05rem;cursor:pointer}'
      +'.gchip{flex:none;display:inline-flex;align-items:center;gap:4px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--orange,#e0852f);background:var(--orange-bg,rgba(240,145,75,.16));color:var(--text);font:700 .78rem system-ui,sans-serif;cursor:pointer}'
      +'@media(max-width:520px){.gn{flex-wrap:wrap}.gn span.t{flex:1 1 100%}}';
    document.head.appendChild(st);
    var msg="You're using a guest account. Your saved papers stay on this browser for "+days+" days.";
    var bar=null,chip=null;
    function showBar(){
      if(bar)return;set(null);if(chip){chip.remove();chip=null}
      bar=document.createElement('div');bar.className='gn';bar.setAttribute('role','note');
      bar.innerHTML='<span aria-hidden="true">ⓘ</span><span class="t"></span><a class="gb" href="/signup">Create account</a><button type="button" aria-label="Close">✕</button>';
      bar.querySelector('.t').textContent=msg;
      bar.querySelector('button').onclick=function(){bar.remove();bar=null;set('closed');showChip()};
      hd.insertAdjacentElement('afterend',bar);
    }
    function showChip(){
      if(chip)return;var me=hd.querySelector('.me');if(!me)return;
      chip=document.createElement('button');chip.type='button';chip.className='gchip';chip.textContent='Guest';chip.setAttribute('aria-label','Guest account info');
      chip.onclick=showBar;me.parentNode.insertBefore(chip,me);
      /* no room in the header (small phones): drop the chip and use a menu item instead */
      if(hd.scrollWidth>hd.clientWidth+1||(me.offsetTop-hd.offsetTop)>20){chip.remove();chip=null;var m=hd.querySelector('.menu');if(m&&!m.querySelector('.gmi')){var a=document.createElement('a');a.className='gmi';a.href='#';a.setAttribute('role','menuitem');a.textContent='\u24d8 Guest account';a.onclick=function(e){e.preventDefault();showBar();window.scrollTo(0,0)};var w=m.querySelector('.menu-who');w?w.after(a):m.prepend(a);}}
    }
    if(get()==='closed')showChip();else showBar();
  }).catch(function(){});
})();
</script>
